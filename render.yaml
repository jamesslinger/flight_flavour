services:
  - type: web
    name: flight-flavour-api
    env: node
    rootDir: ./
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: KIWI_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: flight-flavour
          property: host
      - key: NODE_ENV
        value: production

  - type: web
    name: flight-flavour
    env: static
    rootDir: client
    buildCommand: npm install && npm run build:prod
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_PROXY_URL
        fromService:
          type: web
          name: flight-flavour-api
          property: host